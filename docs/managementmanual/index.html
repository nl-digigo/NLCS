<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset='utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Pas hier de titel van het document aan -->
  <title>Beheerhandleiding NLCS</title>
  <script src="config.js" class="remove"></script>
  <script src='https://cdn.jsdelivr.net/gh/stichting-crow/respec@latest/builds/respec-stichting-crow.js' async class='remove'></script>
  <!-- Eigen opmaak voor de kwaliteitscontrole-tabellen (DigiGO-stijl). ReSpec verwijdert alleen elementen met class="remove", dus deze <style> blijft staan. -->
  <style>
    table[class^="kwaliteitscontrole"] { border-collapse: collapse; width: 100%; margin: 1em 0; }
    table[class^="kwaliteitscontrole"] th,
    table[class^="kwaliteitscontrole"] td { border: 1px solid #DCDCDC; padding: 7px 10px; text-align: left; vertical-align: top; }
    table[class^="kwaliteitscontrole"] thead th { background: #FFE103; }      /* DigiGO-geel */
    table[class^="kwaliteitscontrole"] tbody tr:nth-child(even) { background: #fafafa; }
    table[class^="kwaliteitscontrole"] th.jn,
    table[class^="kwaliteitscontrole"] td.ja,
    table[class^="kwaliteitscontrole"] td.nee { text-align: center; white-space: nowrap; }
    table[class^="kwaliteitscontrole"] td.ja  { font-weight: 600; color: #2E7D32; }
    table[class^="kwaliteitscontrole"] td.nee { color: #999; }
  </style>
</head>

<body>
  <!-- Op https://github.com/stichting-crow/respec/wiki staat een beknopte handleiding voor ReSpec. -->
  <section id="abstract"       data-include-format="markdown" data-include="0-samenvatting.md"></section>
  <section id="sotd"></section>
  <section class="informative" data-include-format="markdown" data-include="1.md"></section>
  <section class="informative" data-include-format="markdown" data-include="2.md"></section>
  <section class="informative" data-include-format="markdown" data-include="3.md"></section>
  <section class="informative" data-include-format="markdown" data-include="4.md"></section>
  <section class="informative" data-include-format="markdown" data-include="5.md"></section>
  <section id="conformance"></section>
  <section id="index"></section>
  <section class="appendix" id="issue-summary"></section>
</body>

</html>
